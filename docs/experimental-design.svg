<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" role="img" aria-labelledby="title desc">
<title id="title">The Scope of Trust — fourteen-cell audit design and deterministic scoring</title>
<desc id="desc">A single-turn synthetic supplier file contains six fixed claims. Only its audit-record section varies across fourteen cells: A, B, D1, C, E improved, E unchanged, E worsened, E_scope improved, E_scope unchanged, E_scope worsened, C prime, D2, A0 and V. Four open-weight models, 36 cases, five repeats per cell, with separate attribution and belief conversations, yielded 20,160 calls. No tools were provided. A rule-based scorer, not an LLM grader, determines claim-status accuracy. Primary comparisons are B minus A, B minus D1, C minus B, and E_scope versus E for correct acceptance.</desc>
<rect width="1280" height="910" fill="#f6f9fc"/><rect width="1280" height="9" fill="#126e7a"/>
<text x="55" y="54" fill="#12263c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="800"><tspan x="55" dy="0">THE SCOPE OF TRUST</tspan></text>
<text x="55" y="82" fill="#5e7184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="400"><tspan x="55" dy="0">One true verification. Six claims. Does audit authority travel beyond the evidence?</tspan></text>
