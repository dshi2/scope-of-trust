<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 810" role="img" aria-labelledby="title desc">
<title id="title">The Scope of Trust: experimental design</title>
<desc id="desc">A three-panel academic schematic. A: supplier dossier with six fixed claims, audit section varies across fourteen conditions, separate attribution and belief contexts, deterministic no-LLM-grader scorer. B: four core audit cells A B D1 C; six outcome controls E improved unchanged worsened and E_scope improved unchanged worsened; additional C prime D2 A0 V. C: 36 cases by 14 cells by 4 models by 5 repeats by 2 contexts = 20,160 calls, zero primary errors, case-level bound.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#20242a}
.h{font-size:19px;font-weight:700}
.h2{font-size:16px;font-weight:700}
.t{font-size:15px}
.s{font-size:13px}
.xs{font-size:12px}
.bold{font-weight:700}
.muted{fill:#57616c}
.blue{fill:#edf5fc;stroke:#4381b8;stroke-width:1.5}
.purple{fill:#f3effb;stroke:#8b72b9;stroke-width:1.5}
.green{fill:#edf7f0;stroke:#579472;stroke-width:1.5}
.gray{fill:#f7f8fa;stroke:#9da9b5;stroke-width:1.4}
.orange{fill:#fff4eb;stroke:#cb905c;stroke-width:1.4}
.paper{fill:#fff;stroke:#9da9b5;stroke-width:1.3}
.line{fill:none;stroke:#63717f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rule{fill:none;stroke:#d2dae2;stroke-width:1}
</style>
<rect x="0" y="0" width="1120" height="810" fill="#fff"/>
<text x="18" y="30" class="h" >A. One case: fixed claims, varied audit record, two separate response contexts</text>
<rect x="18" y="48" width="277" height="205" rx="8" class="blue"/>
<text x="32" y="73" class="h2" >Synthetic supplier dossier</text>
<text x="32" y="99" class="t bold" >Section 1: six claims fixed</text>
<text x="32" y="123" class="s" >• practice claim P</text>
<text x="32" y="143" class="s" >• observed outcome Q_obs</text>
<text x="32" y="163" class="s" >• welfare and causal claims</text>
<text x="32" y="183" class="s" >• two unrelated controls</text>
<text x="32" y="221" class="s muted" >No tools offered in either context.</text>
<path d="M295 151 H322 M315 145 L322 151 L315 157" class="line"/>
<rect x="325" y="48" width="355" height="205" rx="8" class="purple"/>
<text x="339" y="73" class="h2" >Section 2: audit evidence only</text>
<text x="339" y="103" class="t" >14 cell-specific audit records (panel B)</text>
<text x="339" y="132" class="s" >Examples: none, practice verification,</text>
<text x="339" y="152" class="s" >matched unrelated audit, outcome record,</text>
<text x="339" y="172" class="s" >scope wording, or unscoped stamp.</text>
<text x="339" y="221" class="s muted" >Section 3 requests structured assessment.</text>
<path d="M680 151 H707 M700 145 L707 151 L700 157" class="line"/>
<rect x="710" y="48" width="392" height="205" rx="8" class="green"/>
<text x="724" y="73" class="h2" >Response + deterministic scoring</text>
<text x="724" y="102" class="s" >Attribution: one-turn claim-status JSON</text>
<text x="724" y="122" class="s" >Belief: separate fresh probability context</text>
<path d="M724 139 H1088" class="rule"/>
<text x="724" y="163" class="s bold" >Rule-based scorer; no LLM grader</text>
<text x="724" y="185" class="s" >Compare parsed status with evidence-profile gold</text>
<text x="724" y="205" class="s" >Track validity, abstention and missingness</text>
<text x="724" y="233" class="s muted" >Four open-weight models · five repeats</text>
<path d="M18 274 H1102" class="rule"/>
<text x="18" y="304" class="h" >B. Fourteen audit conditions (each tested on the same claims)</text>
<rect x="18" y="322" width="334" height="274" rx="8" class="gray"/>
<text x="32" y="349" class="h2" >Core comparisons (4)</text>
<path d="M32 359 H338" class="rule"/>
<text x="32" y="385" class="t bold" >A</text>
<text x="73" y="385" class="t" >No audit</text>
<text x="32" y="427" class="t bold" >B</text>
<text x="73" y="427" class="t" >Practice audit</text>
<text x="32" y="469" class="t bold" >D1</text>
<text x="73" y="469" class="s" >Matched unrelated-property audit</text>
<text x="32" y="511" class="t bold" >C</text>
<text x="73" y="511" class="s" >Practice audit with scope statement</text>
<text x="32" y="567" class="s muted" >P1 B−A   ·   P2 B−D1   ·   P3 C−B</text>
<rect x="368" y="322" width="377" height="274" rx="8" class="purple"/>
<text x="384" y="349" class="h2" >Audited outcome controls (6)</text>
<path d="M384 359 H730" class="rule"/>
<text x="384" y="384" class="t bold" >E</text>
<text x="425" y="384" class="s" >Outcome record, improved  ↑</text>
<text x="384" y="416" class="t bold" >E</text>
<text x="425" y="416" class="s" >Outcome record, unchanged  =</text>
<text x="384" y="448" class="t bold" >E</text>
<text x="425" y="448" class="s" >Outcome record, worsened  ↓</text>
<path d="M384 460 H730" class="rule"/>
<text x="384" y="485" class="t bold" >E_scope</text>
<text x="478" y="485" class="s" >Improved + explicit scope</text>
<text x="384" y="517" class="t bold" >E_scope</text>
<text x="478" y="517" class="s" >Unchanged + explicit scope</text>
<text x="384" y="549" class="t bold" >E_scope</text>
<text x="478" y="549" class="s" >Worsened + explicit scope</text>
<text x="384" y="576" class="s muted" >P4: E_scope vs E, correct acceptance</text>
<rect x="761" y="322" width="341" height="274" rx="8" class="orange"/>
<text x="776" y="349" class="h2" >Additional controls (4)</text>
<path d="M776 359 H1088" class="rule"/>
<text x="776" y="385" class="t bold" >C′</text>
<text x="832" y="385" class="s" >Scope-format variation</text>
<text x="776" y="427" class="t bold" >D2</text>
<text x="832" y="427" class="s" >Sister-site audit</text>
<text x="776" y="469" class="t bold" >A0</text>
<text x="832" y="469" class="s" >Alternate no-audit control</text>
<text x="776" y="511" class="t bold" >V</text>
<text x="832" y="511" class="s" >Unscoped “Verified ✓” stamp</text>
<text x="776" y="554" class="xs muted" >V is exploratory; its gold label is contested.</text>
<text x="776" y="574" class="xs muted" >Not a primary error-cell comparison.</text>
<path d="M18 616 H1102" class="rule"/>
<text x="18" y="645" class="h" >C. Coverage, analyses and inferential boundary</text>
<rect x="18" y="662" width="1084" height="103" rx="8" class="paper"/>
<text x="34" y="690" class="t bold" >36 builder-written cases × 14 cells × 4 models × 5 repeats × 2 contexts = 20,160 calls</text>
<text x="34" y="716" class="s" >Primary outcome: unsupported Q_obs establishment; observed primary rate 0 in A, B, D1 and C for every model.</text>
<text x="34" y="742" class="s muted" >Zero-event case bound (one-sided 95%): 8.0% per model / cell. No equivalence or P4 noninferiority decision.</text>
<text x="18" y="790" class="s muted" >Models: gpt-oss-120b · DeepSeek-V3.2 · Qwen3-235B · Kimi-K2. Claim statuses are evaluated independently of belief responses.</text>
</svg>
